name: ikki-spark

# Déploiement dual DGX Spark (2x GB10) reliés en direct par ConnectX-7 (QSFP).
# Le modèle est découpé en tensor parallel sur les deux nœuds (TP=2) via le
# backend multi-nœud natif de vLLM (mp, sans Ray).
#
# Même fichier sur les deux machines ; le rôle de chaque nœud (rank, IP,
# interfaces) vient du .env local, voir .env.example. Puis sur chaque nœud :
#   docker compose up -d     (head et worker dans n'importe quel ordre)

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikki-spark-vllm
    container_name: qwen38-vllm
    restart: unless-stopped

    # NCCL/RoCE entre les nœuds : réseau hôte et accès direct aux devices RDMA.
    # L'API reste exposée sur le port 8000 de l'hôte head.
    network_mode: host
    ipc: host
    shm_size: 16g
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - IPC_LOCK

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_FORWARD_COMPAT=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - HF_HOME=/root/.cache/huggingface
      - TORCH_CUDA_ARCH_LIST=12.1a
      - TORCH_MATMUL_PRECISION=high
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TOKENIZERS_PARALLELISM=false
      # Multi-nœud : rôle et IP de ce nœud sur le lien CX7
      - NODE_RANK=${NODE_RANK:?NODE_RANK manquant dans .env}
      - VLLM_HOST_IP=${NODE_IP:?NODE_IP manquant dans .env}
      - NCCL_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - UCX_NET_DEVICES=${CX7_IFNAME:-enp1s0f1np1}
      # Les deux moitiés PCIe du même port QSFP, pour exploiter les 200 Gb/s
      - NCCL_IB_HCA=${CX7_HCA:-rocep1s0f1,roceP2p1s0f1}
      - NCCL_IB_DISABLE=0
      - NCCL_DEBUG=${NCCL_DEBUG:-WARN}

    volumes:
      - /home/mak/ai/models:/root/.cache/huggingface
      - vllm-logs:/var/log/vllm

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    # Notes de tuning (vLLM 0.27.1, GB10 sm_121) :
    # - le drafter MTP n'hérite pas de --attention-backend : sans
    #   attention_backend dans --speculative-config il prend FlashInfer, ce qui
    #   rétrograde tout le moteur en cudagraph PIECEWISE.
    # - max-cudagraph-capture-size = max-num-seqs x (1 + num_speculative_tokens).
    # - KV cache bf16 : le gain mémoire du fp8 est faible sur ce modèle hybride
    #   (état GDN non quantifié) et la mémoire de deux nœuds suffit.
    # - custom all-reduce inopérant entre deux nœuds, désactivé explicitement.
    # - prefix caching + MTP sur hybride GDN : bugs connus en amont (sorties
    #   "!!!!" ou vides, vllm#53912) ; à désactiver si ça apparaît.
    # Tous les arguments sauf VLLM_ROLE_ARGS doivent être identiques sur les
    # deux nœuds : c'est garanti tant que les deux machines sont sur le même
    # commit de ce dépôt.
    command: >
      Qwen/Qwen3.8-27B-FP8
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --nnodes 2
      --node-rank ${NODE_RANK}
      --master-addr ${MASTER_ADDR:?MASTER_ADDR manquant dans .env}
      --master-port ${MASTER_PORT:-29501}
      --max-model-len 262144
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.85
      --max-num-seqs 64
      --kv-cache-dtype auto
      --attention-backend triton_attn
      --enable-chunked-prefill
      --enable-prefix-caching
      --language-model-only
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --chat-template /workspace/unsloth.jinja
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}'
      --max-cudagraph-capture-size 256
      --disable-custom-all-reduce
      --trust-remote-code
      ${VLLM_ROLE_ARGS:?VLLM_ROLE_ARGS manquant dans .env}

    # Seul le head expose /health ; le worker headless est considéré sain
    # tant que son process tourne.
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$NODE_RANK\" != 0 ] || curl -f http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  vllm-logs:
    driver: local
