name: ikki-spark

# Déploiement dual DGX Spark (2x GB10) reliés en direct par ConnectX-7 (QSFP).
# GLM-5.3 Flash (MoE 320B, 18B actifs), poids NVFP4 NVIDIA, découpé en tensor
# parallel sur les deux nœuds (TP=2) via le backend multi-nœud natif de vLLM.
#
# Même fichier sur les deux machines ; le rôle de chaque nœud (rank, IP,
# interfaces) vient du .env local, voir .env.example. Les poids doivent être
# préparés sur chaque nœud avec ./prepare-model.sh. Puis sur chaque nœud :
#   docker compose up -d     (head et worker dans n'importe quel ordre)

services:
  vllm:
    # vLLM standard, nightly du 30/09/2026 (0.30.1rc1.dev396+gac68c3087, CUDA 13.0).
    # glm5_next n'existe dans aucune release : ne pas passer sur un tag stable
    # sans vérifier. Contient le correctif MTP NVFP4 (vllm#55442).
    image: vllm/vllm-openai:nightly-ac68c3087215e0a4f3cdfa218508c6aada57235d
    container_name: glm53-vllm
    restart: unless-stopped

    # NCCL/RoCE entre les nœuds : réseau hôte et accès direct aux devices RDMA.
    # L'API reste exposée sur le port 8000 de l'hôte head.
    network_mode: host
    ipc: host
    shm_size: 16g
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - IPC_LOCK

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_FORWARD_COMPAT=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - HF_HOME=/root/.cache/huggingface
      # Évite l'épuisement de la mémoire unifiée sur les longs prefills (vllm#55569)
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TOKENIZERS_PARALLELISM=false
      # Multi-nœud : rôle et IP de ce nœud sur le lien CX7
      - NODE_RANK=${NODE_RANK:?NODE_RANK manquant dans .env}
      - VLLM_HOST_IP=${NODE_IP:?NODE_IP manquant dans .env}
      - NCCL_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${CX7_IFNAME:-enp1s0f1np1}
      - UCX_NET_DEVICES=${CX7_IFNAME:-enp1s0f1np1}
      # Les deux moitiés PCIe du même port QSFP, pour exploiter les 200 Gb/s
      - NCCL_IB_HCA=${CX7_HCA:-rocep1s0f1,roceP2p1s0f1}
      - NCCL_IB_DISABLE=0
      - NCCL_DEBUG=${NCCL_DEBUG:-WARN}

    volumes:
      - /home/mak/ai/models:/models
      - vllm-logs:/var/log/vllm

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    # Notes de tuning (reprises de la config sudoingX, 2x Spark, 30/09/2026) :
    # - ~95 GiB de poids par nœud sur 121 GiB de mémoire unifiée : marge très
    #   faible, d'où max-num-seqs 1, enforce-eager (pas de mémoire de CUDA
    #   graphs), petits batches de prefill, KV cache fp8 et autotune FlashInfer
    #   coupé. Vider le page cache avant chaque démarrage (README).
    # - glm47 pour les deux parsers : "glm" perd silencieusement les tool calls.
    # - Le modèle fournit son propre chat template.
    # Tous les arguments sauf VLLM_ROLE_ARGS doivent être identiques sur les
    # deux nœuds : c'est garanti tant que les deux machines sont sur le même
    # commit de ce dépôt.
    command: >
      /models/GLM-5.3-Flash-NVFP4
      --served-model-name glm-5.3-flash-nvfp4
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --nnodes 2
      --node-rank ${NODE_RANK}
      --master-addr ${MASTER_ADDR:?MASTER_ADDR manquant dans .env}
      --master-port ${MASTER_PORT:-29501}
      --max-model-len 131072
      --max-num-batched-tokens 2048
      --max-num-seqs 1
      --gpu-memory-utilization 0.84
      --kv-cache-dtype fp8
      --enforce-eager
      --no-enable-flashinfer-autotune
      --language-model-only
      --reasoning-parser glm47
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 5}'
      --trust-remote-code
      ${VLLM_ROLE_ARGS:?VLLM_ROLE_ARGS manquant dans .env}

    # Seul le head expose /health ; le worker headless est considéré sain
    # tant que son process tourne. Chargement de ~100 Go par nœud : long.
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$NODE_RANK\" != 0 ] || curl -f http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  vllm-logs:
    driver: local
